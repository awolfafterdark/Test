name: PickerPatcherApp
options:
  deploymentTarget:
    iOS: '15.0'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  PickerPatcherApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pickerpatcher.app.v07
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        CODE_SIGN_STYLE: Manual
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PickerHarness:
    type: application
    platform: iOS
    sources:
      - path: ../Harness
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pickerpatcher.demo
        INFOPLIST_FILE: ../Harness/Info.plist
        PP_HARNESS_DISPLAY_NAME: Picker Harness
        IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        OTHER_LDFLAGS: '-Wl,-headerpad,0x1000 -framework PhotosUI -framework UniformTypeIdentifiers -framework WebKit'
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: '5.0'
        ENABLE_DEBUG_DYLIB: NO
        CLANG_ENABLE_OBJC_ARC: YES
  PickerBridgeHost:
    type: application
    platform: iOS
    sources:
      - path: ../Harness
        excludes: [Info.plist]
      - path: BridgeResources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pickerpatcher.bridgehost
        INFOPLIST_FILE: ../Harness/Info.plist
        PP_HARNESS_DISPLAY_NAME: Picker Bridge Test
        IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_VERSION: '5.0'
        ENABLE_DEBUG_DYLIB: NO
        CLANG_ENABLE_OBJC_ARC: YES
        OTHER_LDFLAGS: '-framework PhotosUI -framework UniformTypeIdentifiers -framework ImageIO -framework AVFoundation -framework WebKit -Wl,-headerpad,0x1000'
        CODE_SIGNING_ALLOWED: NO
  ImportPickerTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/PickerTests.swift
    dependencies:
      - target: PickerPatcherApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pickerpatcher.import-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PickerPatcherApp
        SWIFT_VERSION: '5.0'
        CODE_SIGNING_ALLOWED: NO
  BridgePickerTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/PickerTests.swift
    dependencies:
      - target: PickerBridgeHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pickerpatcher.bridge-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PickerBridgeHost
        SWIFT_VERSION: '5.0'
        CODE_SIGNING_ALLOWED: NO
schemes:
  PickerPatcherApp:
    build:
      targets:
        PickerPatcherApp: all
    test:
      targets:
        - name: ImportPickerTests
          skippedTests:
            - BridgePickerTests
  PickerBridgeHost:
    build:
      targets:
        PickerBridgeHost: all
    test:
      targets:
        - name: BridgePickerTests
          skippedTests:
            - ImportPickerTests
