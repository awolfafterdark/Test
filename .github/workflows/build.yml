name: Build PickerPatcher for iOS 15

on:
  push:
    paths:
      - 'Core/**'
      - 'Embedded/**'
      - 'PatcherApp/**'
      - 'Tests/**'
      - 'Harness/**'
      - 'Tools/**'
      - 'configure-target.py'
      - 'Makefile'
      - 'control'
      - 'PickerPatcher.plist'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      target_bundle_ids:
        description: 'Comma-separated exact bundle IDs for installed-app .deb'
        required: true
        default: 'dev.pickerpatcher.demo'
        type: string
      app_display_name:
        description: 'Optional name shown under the on-device patcher icon'
        required: false
        default: 'PickerPatcher 0.6'
        type: string
      icon_image_url:
        description: 'Optional direct HTTPS URL to a JPG or PNG for the patcher icon'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout PickerPatcher
        uses: actions/checkout@v4

      - name: Verify project files are at repository root
        run: |
          set -euo pipefail
          for path in configure-target.py Makefile Core/PickerPatcher.m \
            Core/MachOInject.c Tools/build-embedded.sh \
            PatcherApp/project.yml PatcherApp/Sources/IPAPatcher.swift; do
            test -f "$path" || { echo "Missing $path at repository root" >&2; exit 1; }
          done

      - name: Checkout pinned Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: 304e0799973e8145f32e4ca2de6c747a84b758ce
          path: theos
          submodules: recursive

      - name: Configure macOS toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install make dpkg ldid xcodegen
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          version="$(xcrun --sdk iphoneos --show-sdk-version)"
          mkdir -p theos/sdks
          ln -s "$sdk" "theos/sdks/iPhoneOS${version}.sdk"

      - name: Build rootless installed-app tweak
        env:
          THEOS: ${{ github.workspace }}/theos
          TARGET_BUNDLE_IDS: ${{ inputs.target_bundle_ids || 'dev.pickerpatcher.demo' }}
        run: |
          set -euo pipefail
          python3 configure-target.py "$TARGET_BUNDLE_IDS"
          make clean package FINALPACKAGE=1
          mkdir -p dist
          cp packages/*.deb dist/
          dpkg-deb --contents dist/*.deb | grep 'PickerPatcher.dylib'

      - name: Build independent embedded framework and safe injector
        run: |
          set -euo pipefail
          bash Tools/build-embedded.sh "$PWD/dist"
          xcrun clang -O2 -Wall -Wextra -DPP_STANDALONE Core/MachOInject.c -o dist/pp-inject
          if otool -L dist/PickerPatcherEmbedded.framework/PickerPatcherEmbedded | grep -Ei 'substrate|ellekit'; then
            echo 'Embedded build unexpectedly depends on a jailbreak loader' >&2
            exit 1
          fi
          cp Tools/patch_ipa.py dist/
          cp README.md dist/README.md

      - name: Check injector safety cases
        run: python3 Tests/test_macho_inject.py

      - name: Build on-device patcher IPA for TrollStore
        env:
          APP_DISPLAY_NAME: ${{ inputs.app_display_name || 'PickerPatcher 0.6' }}
          ICON_IMAGE_URL: ${{ inputs.icon_image_url || '' }}
        run: |
          set -euo pipefail
          python3 Tools/configure_app.py "$APP_DISPLAY_NAME"
          if [ -n "$ICON_IMAGE_URL" ]; then
            curl --fail --location --proto '=https' --proto-redir '=https' \
              --max-time 90 --max-filesize 10000000 "$ICON_IMAGE_URL" -o "$RUNNER_TEMP/custom-icon"
            icon_format="$(sips -g format "$RUNNER_TEMP/custom-icon" | awk '/format:/ {print tolower($2)}')"
            case "$icon_format" in
              jpeg|png) mv "$RUNNER_TEMP/custom-icon" "$RUNNER_TEMP/custom-icon.$icon_format" ;;
              *) echo 'Icon URL must return a valid JPG or PNG image' >&2; exit 1 ;;
            esac
            swift Tools/make_app_icon.swift "$RUNNER_TEMP/custom-icon.$icon_format"
          else
            swift Tools/make_app_icon.swift
            # Exercise PNG and JPEG decoding/cropping even with no custom URL.
            swift Tools/make_app_icon.swift \
              PatcherApp/Assets.xcassets/AppIcon.appiconset/Icon-ios-marketing-1024x1024-1x.png
            sips -s format jpeg PatcherApp/Assets.xcassets/AppIcon.appiconset/Icon-ios-marketing-1024x1024-1x.png \
              --out "$RUNNER_TEMP/icon-smoke.jpg" >/dev/null
            swift Tools/make_app_icon.swift "$RUNNER_TEMP/icon-smoke.jpg"
            swift Tools/make_app_icon.swift
          fi
          mkdir -p PatcherApp/Resources PatcherApp/BridgeResources
          # Test accidental runtime + embedded loading with a separately compiled
          # simulator image. This dylib is a resource of the test host only.
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          simulator_arch="$(uname -m)"
          xcrun --sdk iphonesimulator clang -arch "$simulator_arch" -target "${simulator_arch}-apple-ios15.0-simulator" \
            -isysroot "$simulator_sdk" -fobjc-arc -fmodules -dynamiclib \
            -framework UIKit -framework UniformTypeIdentifiers -framework ImageIO -framework AVFoundation \
            Core/PickerPatcher.m -o PatcherApp/BridgeResources/PickerPatcherSecond.dylib
          codesign --force --sign - --timestamp=none PatcherApp/BridgeResources/PickerPatcherSecond.dylib
          (cd dist && ditto -c -k --keepParent PickerPatcherEmbedded.framework ../PatcherApp/Resources/Payload.zip)
          cp Core/MachOInject.c Core/MachOInject.h PatcherApp/Sources/
          (cd PatcherApp && xcodegen generate --spec project.yml)
          # Build a known unencrypted app that can be selected, patched, exported,
          # and installed on an iOS 15 device to exercise the media contract.
          xcodebuild -project PatcherApp/PickerPatcherApp.xcodeproj -scheme PickerHarness \
            -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/PickerHarnessDerived" \
            CODE_SIGNING_ALLOWED=NO build
          fixture="$RUNNER_TEMP/PickerHarnessDerived/Build/Products/Release-iphoneos/PickerHarness.app"
          python3 Tools/sign-trollstore-app.py "$fixture" dist/harness-signing.json
          mkdir -p "$RUNNER_TEMP/picker-harness/Payload"
          cp -R "$fixture" "$RUNNER_TEMP/picker-harness/Payload/"
          (cd "$RUNNER_TEMP/picker-harness" && ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/PatcherApp/Resources/PickerHarness.ipa")
          cp PatcherApp/Resources/PickerHarness.ipa dist/PickerHarness-unpatched.ipa
          (cd PatcherApp && xcodegen generate --spec project.yml)
          xcodebuild -project PatcherApp/PickerPatcherApp.xcodeproj -scheme PickerPatcherApp \
            -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/PickerPatcherDerived" \
            CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/PickerPatcherDerived/Build/Products/Release-iphoneos/PickerPatcherApp.app"
          test -f "$app/PickerPatcherApp"
          test -f "$app/Payload.zip"
          test -f "$app/Assets.car"
          python3 Tools/sign-trollstore-app.py "$app" dist/patcher-signing.json
          mkdir -p "$RUNNER_TEMP/pickerpatcher-ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/pickerpatcher-ipa/Payload/"
          (cd "$RUNNER_TEMP/pickerpatcher-ipa" && ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/dist/PickerPatcherApp-TrollStore.ipa")
          unzip -t dist/PickerPatcherApp-TrollStore.ipa >/dev/null

      - name: Test native Files selection and media callback lifecycle in Simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          simulator="$(python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/simulators.json")); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["isAvailable"] and "iPhone" in v["name"]))')"
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          xcrun simctl status_bar "$simulator" override --time '9:41' || true
          xcrun simctl list devices available > dist/simulator-runtime.txt
          test_status=0
          xcodebuild test -project PatcherApp/PickerPatcherApp.xcodeproj -scheme PickerPatcherApp \
            -parallel-testing-enabled NO -configuration Debug -destination "platform=iOS Simulator,id=$simulator" \
            -derivedDataPath "$RUNNER_TEMP/PickerPatcherSim" -resultBundlePath dist/ImportPickerTests.xcresult \
            -only-testing:ImportPickerTests/ImportPickerTests CODE_SIGNING_ALLOWED=NO || test_status=$?
          xcodebuild test -project PatcherApp/PickerPatcherApp.xcodeproj -scheme PickerBridgeHost \
            -parallel-testing-enabled NO -configuration Debug -destination "platform=iOS Simulator,id=$simulator" \
            -derivedDataPath "$RUNNER_TEMP/PickerBridgeSim" -resultBundlePath dist/BridgePickerTests.xcresult \
            -only-testing:BridgePickerTests/BridgePickerTests CODE_SIGNING_ALLOWED=NO || test_status=$?
          exit "$test_status"

      - name: Export test evidence
        if: always()
        run: |
          for suite in ImportPickerTests BridgePickerTests; do
            if [ -d "dist/$suite.xcresult" ]; then
              xcrun xcresulttool get test-results summary --path "dist/$suite.xcresult" > "dist/$suite-summary.json" || true
              xcrun xcresulttool export attachments --path "dist/$suite.xcresult" --output-path "dist/$suite-attachments" || true
            fi
          done
          xcrun simctl list devices booted -j > "$RUNNER_TEMP/booted.json"
          simulator="$(python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/booted.json")); print(next((v["udid"] for vs in d["devices"].values() for v in vs), ""))')"
          if [ -n "$simulator" ]; then
            container="$(xcrun simctl get_app_container "$simulator" dev.pickerpatcher.app.v06 data 2>/dev/null || true)"
            if [ -n "$container" ] && [ -f "$container/Documents/PickerPatcher-diagnostics.txt" ]; then
              cp "$container/Documents/PickerPatcher-diagnostics.txt" dist/simulator-import-diagnostics.txt
            fi
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PickerPatcher-iOS15-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
