name: Build PickerPatcher for iOS 15

on:
  push:
    paths:
      - 'Core/**'
      - 'Embedded/**'
      - 'PatcherApp/**'
      - 'Tests/**'
      - 'Tools/**'
      - 'configure-target.py'
      - 'Makefile'
      - 'control'
      - 'PickerPatcher.plist'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      target_bundle_ids:
        description: 'Comma-separated exact bundle IDs for installed-app .deb'
        required: true
        default: 'dev.pickerpatcher.demo'
        type: string
      ipa_url:
        description: 'Optional URL for a user-provided unencrypted IPA'
        required: false
        type: string
      app_display_name:
        description: 'Optional name shown under the on-device patcher icon'
        required: false
        default: 'PickerPatcher'
        type: string
      icon_jpg_url:
        description: 'Optional HTTPS URL to a JPEG for the on-device patcher icon'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
    steps:
      - name: Checkout PickerPatcher
        uses: actions/checkout@v4

      - name: Verify project files are at repository root
        run: |
          set -euo pipefail
          for path in configure-target.py Makefile Core/PickerPatcher.m \
            Core/MachOInject.c Tools/build-embedded.sh \
            PatcherApp/project.yml PatcherApp/Sources/IPAPatcher.swift; do
            test -f "$path" || { echo "Missing $path at repository root" >&2; exit 1; }
          done

      - name: Checkout pinned Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: 304e0799973e8145f32e4ca2de6c747a84b758ce
          path: theos
          submodules: recursive

      - name: Configure macOS toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install make dpkg ldid xcodegen
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          version="$(xcrun --sdk iphoneos --show-sdk-version)"
          mkdir -p theos/sdks
          ln -s "$sdk" "theos/sdks/iPhoneOS${version}.sdk"

      - name: Build rootless installed-app tweak
        env:
          THEOS: ${{ github.workspace }}/theos
          TARGET_BUNDLE_IDS: ${{ inputs.target_bundle_ids || 'dev.pickerpatcher.demo' }}
        run: |
          set -euo pipefail
          python3 configure-target.py "$TARGET_BUNDLE_IDS"
          make clean package FINALPACKAGE=1
          mkdir -p dist
          cp packages/*.deb dist/
          dpkg-deb --contents dist/*.deb | grep 'PickerPatcher.dylib'

      - name: Build independent embedded framework and safe injector
        run: |
          set -euo pipefail
          bash Tools/build-embedded.sh "$PWD/dist"
          xcrun clang -O2 -Wall -Wextra -DPP_STANDALONE Core/MachOInject.c -o dist/pp-inject
          if otool -L dist/PickerPatcherEmbedded.framework/PickerPatcherEmbedded | grep -Ei 'substrate|ellekit'; then
            echo 'Embedded build unexpectedly depends on a jailbreak loader' >&2
            exit 1
          fi
          cp Tools/patch_ipa.py dist/
          cp README.md dist/README.md

      - name: Check injector safety cases
        run: python3 Tests/test_macho_inject.py

      - name: Build on-device patcher IPA for TrollStore
        env:
          APP_DISPLAY_NAME: ${{ inputs.app_display_name || 'PickerPatcher' }}
          ICON_JPG_URL: ${{ inputs.icon_jpg_url || '' }}
        run: |
          set -euo pipefail
          python3 Tools/configure_app.py "$APP_DISPLAY_NAME"
          if [ -n "$ICON_JPG_URL" ]; then
            curl --fail --location --proto '=https' --proto-redir '=https' \
              --max-time 90 --max-filesize 10000000 "$ICON_JPG_URL" -o "$RUNNER_TEMP/custom-icon.jpg"
            sips -g format "$RUNNER_TEMP/custom-icon.jpg" | grep -qi 'format: jpeg'
            swift Tools/make_app_icon.swift "$RUNNER_TEMP/custom-icon.jpg"
          else
            swift Tools/make_app_icon.swift
            # Exercise JPEG decoding/cropping even when the optional URL is empty.
            sips -s format jpeg PatcherApp/Assets.xcassets/AppIcon.appiconset/Icon-ios-marketing-1024x1024-1x.png \
              --out "$RUNNER_TEMP/icon-smoke.jpg" >/dev/null
            swift Tools/make_app_icon.swift "$RUNNER_TEMP/icon-smoke.jpg"
            swift Tools/make_app_icon.swift
          fi
          mkdir -p PatcherApp/Resources
          (cd dist && ditto -c -k --keepParent PickerPatcherEmbedded.framework ../PatcherApp/Resources/Payload.zip)
          cp Core/MachOInject.c Core/MachOInject.h PatcherApp/Sources/
          (cd PatcherApp && xcodegen generate --spec project.yml)
          xcodebuild -project PatcherApp/PickerPatcherApp.xcodeproj -scheme PickerPatcherApp \
            -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/PickerPatcherDerived" \
            CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/PickerPatcherDerived/Build/Products/Release-iphoneos/PickerPatcherApp.app"
          test -f "$app/PickerPatcherApp"
          test -f "$app/Payload.zip"
          test -f "$app/Assets.car"
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --strict "$app"
          mkdir -p "$RUNNER_TEMP/pickerpatcher-ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/pickerpatcher-ipa/Payload/"
          (cd "$RUNNER_TEMP/pickerpatcher-ipa" && ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/dist/PickerPatcherApp-TrollStore.ipa")
          unzip -t dist/PickerPatcherApp-TrollStore.ipa >/dev/null

      - name: Download optional IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ipa_url != '' }}
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          curl --fail --location --max-time 300 --max-filesize 2000000000 "$IPA_URL" -o input.ipa
          unzip -t input.ipa >/dev/null

      - name: Configure optional signing identity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ipa_url != '' && env.SIGN_IDENTITY != '' }}
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          ENTITLEMENTS_BASE64: ${{ secrets.ENTITLEMENTS_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGN_IDENTITY BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 ENTITLEMENTS_BASE64 KEYCHAIN_PASSWORD; do
            test -n "${!name}" || { echo "Missing signing secret: $name" >&2; exit 1; }
          done
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$ENTITLEMENTS_BASE64" | base64 -D > "$RUNNER_TEMP/entitlements.plist"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/pickerpatcher.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/pickerpatcher.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/pickerpatcher.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/pickerpatcher.keychain-db"
          security list-keychain -d user -s "$RUNNER_TEMP/pickerpatcher.keychain-db"

      - name: Patch and sign optional IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ipa_url != '' && env.SIGN_IDENTITY != '' }}
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: |
          python3 Tools/patch_ipa.py --ipa input.ipa --framework dist/PickerPatcherEmbedded.framework \
            --injector dist/pp-inject --out dist/PickerPatcher-signed.ipa \
            --sign-identity "$SIGN_IDENTITY" --profile "$RUNNER_TEMP/profile.mobileprovision" \
            --entitlements "$RUNNER_TEMP/entitlements.plist"

      - name: Patch optional IPA for external signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ipa_url != '' && env.SIGN_IDENTITY == '' }}
        run: |
          python3 Tools/patch_ipa.py --ipa input.ipa --framework dist/PickerPatcherEmbedded.framework \
            --injector dist/pp-inject --out dist/PickerPatcher-unsigned.ipa

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PickerPatcher-iOS15-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
