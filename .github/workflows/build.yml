name: Build PickerPatcher for iOS 15

on:
  push:
    paths:
      - 'Core/**'
      - 'Embedded/**'
      - 'Tools/**'
      - 'Makefile'
      - 'control'
      - 'PickerPatcher.plist'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      target_bundle_ids:
        description: 'Comma-separated exact bundle IDs for installed-app .deb'
        required: true
        default: 'dev.pickerpatcher.demo'
        type: string
      ipa_url:
        description: 'Optional URL for a user-provided unencrypted IPA'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
    steps:
      - name: Checkout PickerPatcher
        uses: actions/checkout@v4

      - name: Checkout pinned Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: 304e0799973e8145f32e4ca2de6c747a84b758ce
          path: theos
          submodules: recursive

      - name: Checkout pinned Mach-O injector
        uses: actions/checkout@v4
        with:
          repository: tyilo/insert_dylib
          ref: eb7278162af8fcc372e7f2946a2dee6a386b17d8
          path: vendor/insert_dylib

      - name: Configure macOS toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          version="$(xcrun --sdk iphoneos --show-sdk-version)"
          mkdir -p theos/sdks
          ln -s "$sdk" "theos/sdks/iPhoneOS${version}.sdk"

      - name: Build rootless installed-app tweak
        env:
          THEOS: ${{ github.workspace }}/theos
          TARGET_BUNDLE_IDS: ${{ inputs.target_bundle_ids || 'dev.pickerpatcher.demo' }}
        run: |
          set -euo pipefail
          python3 configure-target.py "$TARGET_BUNDLE_IDS"
          make clean package FINALPACKAGE=1
          mkdir -p dist
          cp packages/*.deb dist/
          dpkg-deb --contents dist/*.deb | grep 'PickerPatcher.dylib'

      - name: Build independent embedded framework and injector
        run: |
          set -euo pipefail
          bash Tools/build-embedded.sh "$PWD/dist"
          xcrun clang -O2 -Wall -Wextra vendor/insert_dylib/insert_dylib/main.c -o dist/insert_dylib
          chmod +x dist/insert_dylib
          if otool -L dist/PickerPatcherEmbedded.framework/PickerPatcherEmbedded | grep -Ei 'substrate|ellekit'; then
            echo 'Embedded build unexpectedly depends on a jailbreak loader' >&2
            exit 1
          fi
          cp Tools/patch_ipa.py dist/
          cp README.md dist/README.md

      - name: Download optional IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ipa_url != '' }}
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          curl --fail --location --max-time 300 --max-filesize 2000000000 "$IPA_URL" -o input.ipa
          unzip -t input.ipa >/dev/null

      - name: Configure optional signing identity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ipa_url != '' && env.SIGN_IDENTITY != '' }}
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          ENTITLEMENTS_BASE64: ${{ secrets.ENTITLEMENTS_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGN_IDENTITY BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 ENTITLEMENTS_BASE64 KEYCHAIN_PASSWORD; do
            test -n "${!name}" || { echo "Missing signing secret: $name" >&2; exit 1; }
          done
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$ENTITLEMENTS_BASE64" | base64 -D > "$RUNNER_TEMP/entitlements.plist"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/pickerpatcher.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/pickerpatcher.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/pickerpatcher.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/pickerpatcher.keychain-db"
          security list-keychain -d user -s "$RUNNER_TEMP/pickerpatcher.keychain-db"

      - name: Patch and sign optional IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ipa_url != '' && env.SIGN_IDENTITY != '' }}
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: |
          python3 Tools/patch_ipa.py --ipa input.ipa --framework dist/PickerPatcherEmbedded.framework \
            --injector dist/insert_dylib --out dist/PickerPatcher-signed.ipa \
            --sign-identity "$SIGN_IDENTITY" --profile "$RUNNER_TEMP/profile.mobileprovision" \
            --entitlements "$RUNNER_TEMP/entitlements.plist"

      - name: Patch optional IPA for external signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ipa_url != '' && env.SIGN_IDENTITY == '' }}
        run: |
          python3 Tools/patch_ipa.py --ipa input.ipa --framework dist/PickerPatcherEmbedded.framework \
            --injector dist/insert_dylib --out dist/PickerPatcher-unsigned.ipa

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PickerPatcher-iOS15-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
